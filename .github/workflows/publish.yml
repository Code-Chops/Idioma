name: Publish

# Publishes CodeChops.Idioma to nuget.org: push a tag named after the version (v0.1.0), or run it by hand on such a
# tag. It signs in through trusted publishing, so the repository holds no API key: nuget.org needs a trusted publishing
# policy for this repository and this workflow file (publish.yml).
#
# The publish job can get an API key for nuget.org, so each action this workflow uses is pinned to a commit, with its
# version in the comment behind it: a tag such as v4 is one its owner can move to other code.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Nothing is published that no app has consumed: an app is built against the packed package with the compiler of
  # .NET SDK 10, published with NativeAOT, and run, as in CI (ci.yml). CI runs on main and on pull requests only, so
  # without this job a tag on a commit that CI never built would publish without it. A job of its own, which can't
  # sign in to nuget.org: it installs a toolchain and restores more packages than the publish job does.
  aot-smoke:
    name: NativeAOT smoke test of the package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 10.0.1xx and no later band of SDK 10, as in CI: only that band has the compiler the generators are built against.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.1xx
            11.0.x

      # NativeAOT links with the toolchain of the platform.
      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Pack, publish a consumer with NativeAOT, and run it
        run: ./tests/Idioma.AotSmoke/run.sh

      # A demo fetches the published package, so a demo written for a newer API fails for every visitor until that
      # version is out. This shows that the demos run with the package as it is packed here.
      - name: Run the demos against the package
        run: ./tests/Idioma.Demos/run.sh

  # Builds, tests, and packs what the publish job pushes. A job of its own, which can't sign in to nuget.org: it restores
  # and runs the packages of the tests, and code of theirs must not run where an API key can be had.
  pack:
    name: Test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A run by hand starts from the branch or tag picked for it, and a branch names no version to hold the package
      # to, so only a version tag publishes.
      - name: Check that the run is on a version tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a version tag such as v0.1.0, not on '${GITHUB_REF_NAME}'."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # A warning fails the build and the pack, as in CI: nothing is published that CI would turn down.
      - name: Build
        run: dotnet build Idioma.slnx -c Release -warnaserror

      - name: Tests (net10.0)
        run: dotnet run --project tests/Idioma.Tests/Idioma.Tests.csproj -c Release -f net10.0 --no-build

      - name: Tests (net11.0)
        run: dotnet run --project tests/Idioma.Tests/Idioma.Tests.csproj -c Release -f net11.0 --no-build

      - name: Pack
        run: dotnet pack src/Idioma/Idioma.csproj -c Release --no-build -o artifacts -warnaserror

      # A tag that names another version than the project file would publish something else than it says.
      - name: Check the tag against the version
        run: test -f "artifacts/CodeChops.Idioma.${GITHUB_REF_NAME#v}.nupkg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          if-no-files-found: error
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  # Pushes the package the pack job made, and does nothing else: no checkout, no restore, and no code of the
  # repository or of a package runs in the job that can get an API key.
  publish:
    name: Publish
    needs: [aot-smoke, pack]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets GitHub issue the token that nuget.org exchanges for a short-lived API key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      # For `dotnet nuget push` alone.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Sign in to nuget.org
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: CodeChops

      # The symbols package (.snupkg) next to the package is pushed along.
      - name: Push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
