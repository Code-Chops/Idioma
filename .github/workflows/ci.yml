name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The package targets net10.0, and the tests run on every supported runtime.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # A warning fails the build here, so that none comes in unnoticed.
      - name: Build
        run: dotnet build Idioma.slnx -c Release -warnaserror

      # The suite runs on Microsoft.Testing.Platform (TUnit), so it is executed, not `dotnet test`ed.
      - name: Tests (net10.0)
        run: dotnet run --project tests/Idioma.Tests/Idioma.Tests.csproj -c Release -f net10.0 --no-build

      - name: Tests (net11.0)
        run: dotnet run --project tests/Idioma.Tests/Idioma.Tests.csproj -c Release -f net11.0 --no-build

      # Here too: NuGet warns when a file of the package is not where it reads it, such as the one in its build folder.
      - name: Pack
        run: dotnet pack src/Idioma/Idioma.csproj -c Release --no-build -o artifacts -warnaserror

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  # The package says it is safe to trim, and that it works with the compiler of .NET SDK 10.0.100, which the build above
  # (SDK 11, by global.json) does not show. So an app of its own consumes the packed package, is built with SDK 10 and
  # published with NativeAOT, and checks its texts when it runs.
  aot-smoke:
    name: NativeAOT smoke test of the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # NativeAOT links with the toolchain of the platform.
      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Pack, publish a consumer with NativeAOT, and run it
        run: ./tests/Idioma.AotSmoke/run.sh
