name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # On Windows and macOS too, where most users of the package write their code. A test that only passes with the paths
  # or the line endings of Linux fails there.
  build-test-pack:
    name: Build, test, and pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # The package targets net10.0, and the tests run on every supported runtime.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # A warning fails the build here, so that none comes in unnoticed.
      - name: Build
        run: dotnet build Idioma.slnx -c Release -warnaserror

      # The suite runs on Microsoft.Testing.Platform (TUnit), so it is executed, not `dotnet test`ed.
      - name: Tests (net10.0)
        run: dotnet run --project tests/Idioma.Tests/Idioma.Tests.csproj -c Release -f net10.0 --no-build

      - name: Tests (net11.0)
        run: dotnet run --project tests/Idioma.Tests/Idioma.Tests.csproj -c Release -f net11.0 --no-build

      # Here too: NuGet warns when a file of the package is not where it reads it, such as the one in its build folder.
      - name: Pack
        run: dotnet pack src/Idioma/Idioma.csproj -c Release --no-build -o artifacts -warnaserror

      # Once: the package is the same on every platform.
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  # The package says it is safe to trim, and that it works with the compiler of .NET SDK 10.0.100, which the build above
  # (SDK 11, by global.json) does not show. So an app of its own consumes the packed package, is built with SDK 10 and
  # published with NativeAOT, and checks its texts when it runs.
  aot-smoke:
    name: NativeAOT smoke test of the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 10.0.1xx and no later band of SDK 10: only that band has the compiler the generators are built against
      # (Roslyn 5.0), and the app's global.json takes no other. SDK 11 packs the package.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.1xx
            11.0.x

      # NativeAOT links with the toolchain of the platform.
      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Pack, publish a consumer with NativeAOT, and run it
        run: ./tests/Idioma.AotSmoke/run.sh

      # A demo fetches the published package, so a demo written for a newer API fails for every visitor until that
      # version is out. This shows that the demos run with the package as it is packed here.
      - name: Run the demos against the package
        run: ./tests/Idioma.Demos/run.sh

  # The benchmarks are no part of the solution, so a change of the API would break them unnoticed. They are built
  # here, and each approach is checked to show the expected wording, which takes no timing. The numbers of
  # docs/performance.md come from benchmarks/run.sh on one machine, and not from here.
  benchmarks:
    name: Build the benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Build
        run: |
          dotnet build benchmarks/Idioma.Benchmarks -c Release -warnaserror
          dotnet build benchmarks/Idioma.Benchmarks.Wasm -c Release -warnaserror
          dotnet build benchmarks/Idioma.Benchmarks.Size -c Release -warnaserror

      - name: Check that every approach shows the expected wording
        run: dotnet benchmarks/Idioma.Benchmarks/bin/Release/net11.0/Idioma.Benchmarks.dll check
