<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Idioma benchmarks</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">Loading</div>
    <script>
        // Called by BenchmarkPage with what this page measured. The runner answers with the next page, or nothing when
        // every page has run.
        async function benchmarkReport(report) {
            const response = await fetch('report', { method: 'POST', body: `browser\t${navigator.userAgent}\n${report}` });
            const next = await response.text();
            if (next) {
                location.href = next;
            }
        }
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
